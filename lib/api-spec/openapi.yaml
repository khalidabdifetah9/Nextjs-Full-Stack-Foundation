openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: authentication
    description: Account registration and authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerUser
      tags: [authentication]
      summary: Create an account
      description: Creates an email-and-password account and returns its public profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUserProfile"
        "400":
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An account already exists for one of the unique fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The account could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/signin:
    post:
      operationId: signInUser
      tags: [authentication]
      summary: Sign in to an account
      description: Verifies an email-and-password account and sets a signed session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "400":
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The account could not be signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RegisterUserRequest:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          minLength: 1
          maxLength: 32
          description: Optional phone number.
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Must satisfy at least three of the password strength rules shown in the signup form.
      required:
        - fullName
        - email
        - password
    CreatedUserProfile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - email
        - createdAt
    SignInRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        rememberMe:
          type: boolean
      required:
        - email
        - password
    SignInUserProfile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
      required:
        - id
        - fullName
        - email
    SignInResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/SignInUserProfile"
      required:
        - user
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
      required:
        - error

